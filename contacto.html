<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barniz Galeras | Contacto</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg-dark: #0b0705; --wood-dark: #1a0f07; --gold-light: #f6d77a; --gold-dark: #c9822a; --text-light: #f7e6bd; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg-dark); color: var(--text-light); font-family: 'Montserrat', sans-serif; }

        header { background: rgba(26,15,7,0.98); border-bottom: 2px solid var(--gold-dark); position: sticky; top: 0; z-index: 1000; backdrop-filter: blur(8px); }
        .header-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; }
        .brand { display: flex; align-items: center; gap: 15px; text-decoration: none; }
        .brand img { height: 55px; width: 55px; border-radius: 50%; border: 2px solid var(--gold-light); object-fit: cover; }
        .brand-title { font-family: 'Cinzel Decorative', serif; font-size: 1.4rem; color: var(--gold-light); font-weight: 900; }

        nav ul { display: flex; list-style: none; gap: 20px; }
        nav a { color: var(--text-light); text-decoration: none; font-size: 0.85rem; font-weight: 600; text-transform: uppercase; }
        nav a:hover, nav a.active { color: var(--gold-light); border-bottom: 2px solid var(--gold-light); padding-bottom: 4px; }

        /* PORTADA CONTACTO */
        .hero-banner { width: 100%; height: 260px; background: linear-gradient(rgba(11,7,5,0.7), rgba(11,7,5,0.9)), url('https://images.unsplash.com/photo-1423666639041-f56000c27a9a?auto=format&fit=crop&w=1350&q=80') center/cover no-repeat; display: flex; justify-content: center; align-items: center; border-bottom: 1px solid var(--gold-dark); }
        .hero-banner h1 { font-family: 'Cinzel Decorative', serif; font-size: 2.5rem; color: var(--gold-light); }

        section { max-width: 700px; margin: 50px auto; padding: 0 20px; }

        .form-box { background: var(--wood-dark); border: 1px solid var(--gold-dark); border-radius: 12px; padding: 35px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.9rem; }
        .form-group input, .form-group textarea { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid var(--gold-dark); background: var(--bg-dark); color: var(--text-light); font-family: 'Montserrat', sans-serif; }

        .btn-submit { background: linear-gradient(var(--gold-light), var(--gold-dark)); color: #000; border: none; padding: 14px 30px; border-radius: 25px; font-weight: bold; cursor: pointer; width: 100%; font-size: 1rem; transition: transform 0.2s; }
        .btn-submit:hover { transform: scale(1.02); }

        .contact-info { text-align: center; margin-top: 30px; line-height: 1.8; }

        footer { background: var(--wood-dark); text-align: center; padding: 30px; border-top: 1px solid var(--gold-dark); margin-top: 80px; font-size: 0.85rem; }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <a href="index.html" class="brand">
                <img src="logo.jpg" alt="Barniz Galeras Logo">
                <span class="brand-title">BARNIZ GALERAS</span>
            </a>
            <nav>
                <ul>
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="tienda.html">Tienda & Artesanos</a></li>
                    <li><a href="patrimonio.html">Patrimonio</a></li>
                    <li><a href="guia.html">Guía Interactiva</a></li>
                    <li><a href="contacto.html" class="active">Contacto</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="hero-banner">
        <h1>Atención y Encargos Especiales</h1>
    </div>

    <section>
        <div class="form-box">
            <form action="https://formsubmit.co/juanfelipeprado963@gmail.com" method="POST">
                <div class="form-group">
                    <label for="nombre">Nombre Completo:</label>
                    <input type="text" id="nombre" name="nombre" required placeholder="Tu nombre y apellido">
                </div>
                <div class="form-group">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" name="email" required placeholder="tu@correo.com">
                </div>
                <div class="form-group">
                    <label for="mensaje">Consulta o Pedido por Encargo:</label>
                    <textarea id="mensaje" name="mensaje" rows="5" required placeholder="Escribe los detalles de la pieza artesanal que deseas adquirir..."></textarea>
                </div>
                <button type="submit" class="btn-submit">Enviar Consulta / Encargo</button>
            </form>

            <div class="contact-info">
                <p><strong>WhatsApp Directo:</strong> +57 333 251 3354</p>
                <p><strong>Correo Electrónico:</strong> juanfelipeprado963@gmail.com</p>
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 Barniz Galeras - San Juan de Pasto, Nariño. Todos los derechos reservados.</p>
    </footer>

</body>
</html>
